<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>經絡調理｜客戶管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f5f2;
  --surface: #ffffff;
  --surface2: #f0ede8;
  --border: #e2ddd8;
  --border2: #ccc8c2;
  --text: #1a1814;
  --text2: #6b6660;
  --text3: #a09b96;
  --teal: #2d7d6f;
  --teal-bg: #e8f5f2;
  --teal-light: #b8ddd8;
  --amber: #b5620d;
  --amber-bg: #fdf3e7;
  --red: #c0392b;
  --red-bg: #fdf0ee;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.05);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
}

.app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); }

/* screens */
.screen { display: none; }
.screen.active { display: block; }

/* topbar */
.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}
.topbar h1 { flex: 1; font-size: 17px; font-weight: 500; }
.topbar-logo { font-size: 11px; color: var(--text3); letter-spacing: .5px; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 8px 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  background: var(--surface); color: var(--text);
  font-size: 14px; font-family: inherit;
  cursor: pointer; white-space: nowrap;
  transition: background .15s, border-color .15s;
}
.btn:hover { background: var(--surface2); }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--teal); color: #fff; border-color: var(--teal); }
.btn-primary:hover { background: #236358; border-color: #236358; }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn-icon { padding: 7px 10px; }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { background: var(--surface2); border-color: var(--border); }

/* client list */
.list-wrap { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.empty-state {
  padding: 60px 20px; text-align: center; color: var(--text3);
}
.empty-state .icon { font-size: 40px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

.client-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: box-shadow .15s, border-color .15s;
}
.client-card:hover { border-color: var(--border2); box-shadow: var(--shadow-md); }

.avatar {
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--teal-bg); color: var(--teal);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 500; flex-shrink: 0;
  border: 1px solid var(--teal-light);
}
.client-info { flex: 1; min-width: 0; }
.client-name { font-size: 15px; font-weight: 500; }
.client-meta { font-size: 12px; color: var(--text3); margin-top: 2px; }
.chevron { color: var(--text3); font-size: 16px; }

/* sections */
.section { padding: 16px 16px; }
.section + .section { padding-top: 0; }
.section-label {
  font-size: 11px; color: var(--text3); letter-spacing: .8px;
  text-transform: uppercase; margin-bottom: 10px;
  padding-bottom: 6px; border-bottom: 1px solid var(--border);
}
.divider { height: 8px; background: var(--bg); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }

/* form */
.field { margin-bottom: 14px; }
.field:last-child { margin-bottom: 0; }
.field label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 5px; font-weight: 400; }
.field input, .field textarea, .field select {
  width: 100%; padding: 10px 12px;
  border: 1px solid var(--border2); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text);
  font-size: 14px; font-family: inherit; line-height: 1.5;
  transition: border-color .15s, box-shadow .15s;
  -webkit-appearance: none;
}
.field input:focus, .field textarea:focus, .field select:focus {
  outline: none; border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(45,125,111,.1);
}
.field textarea { resize: vertical; min-height: 72px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* chips */
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 5px 11px; border-radius: 20px; font-size: 13px;
  border: 1px solid var(--border2); background: var(--surface);
  color: var(--text2); cursor: pointer; user-select: none;
  transition: all .12s;
}
.chip:hover { border-color: var(--teal); color: var(--teal); }
.chip.on { background: var(--teal); color: #fff; border-color: var(--teal); }
.chip.on-display { background: var(--teal-bg); color: var(--teal); border-color: var(--teal-light); pointer-events: none; font-size: 12px; }

/* profile */
.profile-header {
  padding: 20px 16px 16px;
  background: var(--surface);
  display: flex; align-items: center; gap: 14px;
}
.profile-avatar {
  width: 54px; height: 54px; border-radius: 50%;
  background: var(--teal-bg); color: var(--teal);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 500; flex-shrink: 0;
  border: 2px solid var(--teal-light);
}
.profile-name { font-size: 19px; font-weight: 500; }
.profile-sub { font-size: 13px; color: var(--text3); margin-top: 2px; }

.info-table { width: 100%; border-collapse: collapse; }
.info-table tr { border-bottom: 1px solid var(--border); }
.info-table tr:last-child { border-bottom: none; }
.info-table td { padding: 9px 0; font-size: 13px; vertical-align: top; }
.info-table td:first-child { color: var(--text3); width: 96px; padding-right: 8px; }
.caution { color: var(--red) !important; font-size: 13px; }

.note-block { margin-bottom: 10px; }
.note-block:last-child { margin-bottom: 0; }
.note-label { font-size: 11px; color: var(--text3); margin-bottom: 3px; }
.note-text { font-size: 13px; color: var(--text); line-height: 1.65; }

/* session card */
.session-wrap { display: flex; flex-direction: column; gap: 10px; }
.session-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow);
}
.session-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.session-num { font-size: 12px; color: var(--text3); }
.session-date { font-size: 14px; font-weight: 500; }

.scores { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
.score-box { background: var(--surface2); border-radius: var(--radius-sm); padding: 8px 6px; text-align: center; }
.score-lbl { font-size: 10px; color: var(--text3); }
.score-val { font-size: 17px; font-weight: 500; margin-top: 1px; }
.s-good { color: var(--teal); }
.s-mid { color: var(--amber); }
.s-bad { color: var(--red); }

.next-box {
  background: var(--teal-bg);
  border: 1px solid var(--teal-light);
  border-radius: var(--radius-sm);
  padding: 10px 12px; margin-top: 10px;
}
.next-box .note-label { color: var(--teal); }

/* sticky add btn */
.sticky-add {
  position: sticky; bottom: 0;
  padding: 12px 16px;
  background: var(--bg);
  border-top: 1px solid var(--border);
}

/* alert */
.alert {
  background: var(--red-bg); border: 1px solid #f5c0ba;
  border-radius: var(--radius-sm); padding: 10px 12px;
  font-size: 13px; color: var(--red); margin-bottom: 14px;
  display: none;
}
.alert.show { display: block; }
</style>
</head>
<body>
<div class="app">

<!-- 客戶列表 -->
<div id="s-list" class="screen active">
  <div class="topbar">
    <h1>客戶管理</h1>
    <span class="topbar-logo">經絡調理</span>
    <button class="btn btn-primary btn-sm" onclick="showNewClient()">＋ 新增</button>
  </div>
  <div class="list-wrap" id="client-list"></div>
</div>

<!-- 新增客戶 -->
<div id="s-new-client" class="screen">
  <div class="topbar">
    <button class="btn btn-icon btn-ghost" onclick="goHome()">← 返回</button>
    <h1>新增客戶</h1>
    <button class="btn btn-primary btn-sm" onclick="saveNewClient()">儲存</button>
  </div>
  <div id="nc-alert" class="alert" style="margin:12px 16px 0;">請填寫客戶姓名</div>

  <div class="section">
    <div class="section-label">基本資料</div>
    <div class="field"><label>姓名 *</label><input id="nc-name" placeholder="客戶姓名" autocomplete="off"></div>
    <div class="row2">
      <div class="field">
        <label>性別</label>
        <select id="nc-gender"><option value="">—</option><option>女</option><option>男</option><option>其他</option></select>
      </div>
      <div class="field"><label>年齡</label><input id="nc-age" type="number" placeholder="歲" min="1" max="120"></div>
    </div>
    <div class="field"><label>聯絡方式</label><input id="nc-contact" placeholder="電話 / LINE"></div>
    <div class="field"><label>職業 / 生活型態</label><input id="nc-job" placeholder="例：久坐辦公室、教師、勞動工作"></div>
  </div>

  <div class="divider"></div>
  <div class="section">
    <div class="section-label">健康背景</div>
    <div class="field"><label>病史 / 手術史</label><textarea id="nc-history" placeholder="例：高血壓、2020年膝蓋手術…"></textarea></div>
    <div class="field"><label>目前用藥</label><input id="nc-meds" placeholder="若無請填「無」"></div>
    <div class="field"><label>禁忌 / 特殊注意事項</label><textarea id="nc-contra" placeholder="例：孕期、骨質疏鬆、特定部位需避免施力…" style="border-color:#e8b4ae;"></textarea></div>
  </div>

  <div class="divider"></div>
  <div class="section">
    <div class="section-label">體質評估（初診）</div>
    <div class="field">
      <label>主要體質傾向</label>
      <div class="chip-row" id="nc-constitution">
        <span class="chip" onclick="toggleChip(this)">氣滯</span>
        <span class="chip" onclick="toggleChip(this)">血瘀</span>
        <span class="chip" onclick="toggleChip(this)">陽虛</span>
        <span class="chip" onclick="toggleChip(this)">陰虛</span>
        <span class="chip" onclick="toggleChip(this)">痰濕</span>
        <span class="chip" onclick="toggleChip(this)">氣虛</span>
        <span class="chip" onclick="toggleChip(this)">肝鬱</span>
        <span class="chip" onclick="toggleChip(this)">濕熱</span>
      </div>
    </div>
    <div class="field"><label>調理師初評小結</label><textarea id="nc-assessment" placeholder="整體體質判斷、主要病灶方向、施作觀察…"></textarea></div>
  </div>

  <div class="divider"></div>
  <div class="section">
    <div class="section-label">調理重點方向</div>
    <div class="field"><label>優先處理部位 / 經絡</label><textarea id="nc-meridian" placeholder="例：膀胱經背段、肝膽經下肢段、腰薦椎周圍…"></textarea></div>
    <div class="field"><label>根本調理方向</label><textarea id="nc-direction" placeholder="例：疏肝理氣為主，兼顧補腎陽、改善下焦循環…"></textarea></div>
  </div>
  <div style="height:20px;"></div>
</div>

<!-- 客戶頁面 -->
<div id="s-profile" class="screen">
  <div class="topbar">
    <button class="btn btn-icon btn-ghost" onclick="goHome()">← 返回</button>
    <h1 id="profile-title"></h1>
    <button class="btn btn-sm btn-ghost" onclick="deleteClient()">刪除</button>
  </div>
  <div id="profile-content"></div>
  <div class="section">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <div class="section-label" style="margin:0; border:none; padding:0;">調理紀錄</div>
      <button class="btn btn-sm" onclick="showNewSession()">＋ 新增一筆</button>
    </div>
    <div id="session-list" class="session-wrap"></div>
    <div style="height:12px;"></div>
  </div>
</div>

<!-- 新增調理紀錄 -->
<div id="s-new-session" class="screen">
  <div class="topbar">
    <button class="btn btn-icon btn-ghost" onclick="showProfile(currentClientId)">← 返回</button>
    <h1>新增調理紀錄</h1>
    <button class="btn btn-primary btn-sm" onclick="saveSession()">儲存</button>
  </div>

  <div class="section">
    <div class="section-label">上次回報</div>
    <div class="field"><label>客戶反映（上次調理後的變化）</label><textarea id="ns-feedback" placeholder="例：背部輕鬆許多、睡眠改善、痠痛有減少…"></textarea></div>
  </div>

  <div class="divider"></div>
  <div class="section">
    <div class="section-label">調理前評估</div>
    <div class="field"><label>今日主訴</label><textarea id="ns-complaint" placeholder="今天最不舒服的部位 / 當下的身體狀態…"></textarea></div>
    <div class="row2">
      <div class="field"><label>疼痛感（前）0–10</label><input id="ns-pb" type="number" min="0" max="10" placeholder="分"></div>
      <div class="field"><label>緊繃感（前）0–10</label><input id="ns-tb" type="number" min="0" max="10" placeholder="分"></div>
    </div>
    <div class="field"><label>舌象觀察</label><input id="ns-tongue" placeholder="例：舌淡紅、苔薄白微膩…"></div>
  </div>

  <div class="divider"></div>
  <div class="section">
    <div class="section-label">本次施作</div>
    <div class="field"><label>操作部位 / 經絡</label><textarea id="ns-areas" placeholder="例：膀胱經全段、肩頸斜方肌、膽經大腿段…"></textarea></div>
    <div class="field">
      <label>使用手法</label>
      <div class="chip-row" id="ns-techniques">
        <span class="chip" onclick="toggleChip(this)">撥筋</span>
        <span class="chip" onclick="toggleChip(this)">推拿</span>
        <span class="chip" onclick="toggleChip(this)">熱敷</span>
        <span class="chip" onclick="toggleChip(this)">拍打</span>
        <span class="chip" onclick="toggleChip(this)">拔罐</span>
        <span class="chip" onclick="toggleChip(this)">刮痧</span>
        <span class="chip" onclick="toggleChip(this)">精油</span>
      </div>
    </div>
    <div class="field"><label>特別發現（結節、反應明顯穴位等）</label><textarea id="ns-findings" placeholder="例：L3附近有明顯結節、膽經大腿段反應強烈…"></textarea></div>
  </div>

  <div class="divider"></div>
  <div class="section">
    <div class="section-label">調理後評估</div>
    <div class="row2">
      <div class="field"><label>疼痛感（後）0–10</label><input id="ns-pa" type="number" min="0" max="10" placeholder="分"></div>
      <div class="field"><label>緊繃感（後）0–10</label><input id="ns-ta" type="number" min="0" max="10" placeholder="分"></div>
    </div>
    <div class="row2">
      <div class="field"><label>睡眠品質 1–5</label><input id="ns-sleep" type="number" min="1" max="5" placeholder="分"></div>
      <div class="field"><label>精神狀態 1–5</label><input id="ns-energy" type="number" min="1" max="5" placeholder="分"></div>
    </div>
    <div class="field"><label>客戶即時感受</label><textarea id="ns-response" placeholder="例：腰部明顯輕鬆、微痠感、感覺發熱…"></textarea></div>
  </div>

  <div class="divider"></div>
  <div class="section">
    <div class="section-label">下次提醒</div>
    <div class="field"><label>居家保養建議</label><textarea id="ns-homecare" placeholder="例：每日熱敷腰部 15 分鐘、避免久坐、多補水…"></textarea></div>
    <div class="field"><label>下次調理重點</label><textarea id="ns-next" placeholder="例：加強下焦循環、增加肝經段施作…"></textarea></div>
  </div>
  <div style="height:20px;"></div>
</div>

</div><!-- .app -->

<script>
var clients = JSON.parse(localStorage.getItem('meridian_v2') || '[]');
var currentClientId = null;

function save() { localStorage.setItem('meridian_v2', JSON.stringify(clients)); }

function initials(name) { return name ? name.slice(0,1) : '?'; }

function fmt(iso) {
  var d = new Date(iso);
  return d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
}

function show(id) {
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function goHome() { renderList(); show('s-list'); }

function toggleChip(el) { el.classList.toggle('on'); }

function getChips(containerId) {
  return Array.from(document.querySelectorAll('#' + containerId + ' .chip.on'))
    .map(function(c){ return c.textContent; }).join('、');
}

function clearChips(containerId) {
  document.querySelectorAll('#' + containerId + ' .chip').forEach(function(c){ c.classList.remove('on'); });
}

function renderList() {
  var el = document.getElementById('client-list');
  if (!clients.length) {
    el.innerHTML = '<div class="empty-state"><div class="icon">🌿</div><p>尚無客戶紀錄<br>點右上角「新增」開始建立</p></div>';
    return;
  }
  el.innerHTML = clients.map(function(c, i) {
    var cnt = c.sessions ? c.sessions.length : 0;
    var last = cnt ? '最近：' + fmt(c.sessions[cnt-1].date) : '尚無調理紀錄';
    return '<div class="client-card" onclick="showProfile(' + i + ')">' +
      '<div class="avatar">' + initials(c.name) + '</div>' +
      '<div class="client-info">' +
        '<div class="client-name">' + c.name + '</div>' +
        '<div class="client-meta">' + (c.age ? c.age + '歲　' : '') + '共 ' + cnt + ' 次　' + last + '</div>' +
      '</div>' +
      '<span class="chevron">›</span>' +
    '</div>';
  }).join('');
}

function showNewClient() {
  ['nc-name','nc-contact','nc-age','nc-job','nc-history','nc-meds','nc-contra','nc-assessment','nc-meridian','nc-direction'].forEach(function(id){
    document.getElementById(id).value = '';
  });
  document.getElementById('nc-gender').value = '';
  clearChips('nc-constitution');
  document.getElementById('nc-alert').classList.remove('show');
  show('s-new-client');
}

function saveNewClient() {
  var name = document.getElementById('nc-name').value.trim();
  if (!name) { document.getElementById('nc-alert').classList.add('show'); return; }
  document.getElementById('nc-alert').classList.remove('show');
  clients.push({
    name: name,
    gender: document.getElementById('nc-gender').value,
    age: document.getElementById('nc-age').value,
    contact: document.getElementById('nc-contact').value,
    job: document.getElementById('nc-job').value,
    history: document.getElementById('nc-history').value,
    meds: document.getElementById('nc-meds').value,
    contra: document.getElementById('nc-contra').value,
    constitution: getChips('nc-constitution'),
    assessment: document.getElementById('nc-assessment').value,
    meridian: document.getElementById('nc-meridian').value,
    direction: document.getElementById('nc-direction').value,
    sessions: [],
    createdAt: new Date().toISOString()
  });
  save();
  showProfile(clients.length - 1);
}

function deleteClient() {
  if (!confirm('確定刪除「' + clients[currentClientId].name + '」及其所有紀錄？')) return;
  clients.splice(currentClientId, 1);
  save();
  goHome();
}

function showProfile(idx) {
  currentClientId = idx;
  var c = clients[idx];
  document.getElementById('profile-title').textContent = c.name;

  var html = '<div class="profile-header">' +
    '<div class="profile-avatar">' + initials(c.name) + '</div>' +
    '<div><div class="profile-name">' + c.name + '</div>' +
    '<div class="profile-sub">' + (c.gender||'') + (c.age?' · '+c.age+'歲':'') + (c.job?' · '+c.job:'') + '</div></div>' +
  '</div><div class="divider"></div>' +
  '<div class="section"><div class="section-label">基本資料</div>' +
  '<table class="info-table">' +
  (c.contact ? '<tr><td>聯絡方式</td><td>' + c.contact + '</td></tr>' : '') +
  (c.history ? '<tr><td>病史</td><td>' + c.history + '</td></tr>' : '') +
  (c.meds ? '<tr><td>用藥</td><td>' + c.meds + '</td></tr>' : '') +
  (c.contra ? '<tr><td>禁忌注意</td><td class="caution">⚠ ' + c.contra + '</td></tr>' : '') +
  '</table></div><div class="divider"></div>' +
  '<div class="section"><div class="section-label">體質與調理方向</div>' +
  (c.constitution ? '<div class="note-block"><div class="note-label">體質傾向</div><div class="chip-row">' +
    c.constitution.split('、').filter(Boolean).map(function(t){ return '<span class="chip on-display">' + t + '</span>'; }).join('') +
  '</div></div>' : '') +
  (c.assessment ? '<div class="note-block"><div class="note-label">調理師初評小結</div><div class="note-text">' + c.assessment + '</div></div>' : '') +
  (c.meridian ? '<div class="note-block"><div class="note-label">優先部位 / 經絡</div><div class="note-text">' + c.meridian + '</div></div>' : '') +
  (c.direction ? '<div class="note-block"><div class="note-label">根本調理方向</div><div class="note-text">' + c.direction + '</div></div>' : '') +
  '</div><div class="divider"></div>';

  document.getElementById('profile-content').innerHTML = html;
  renderSessions();
  show('s-profile');
}

function renderSessions() {
  var c = clients[currentClientId];
  var el = document.getElementById('session-list');
  var sessions = c.sessions || [];
  if (!sessions.length) {
    el.innerHTML = '<div style="text-align:center;padding:30px 0;color:var(--text3);font-size:14px;">尚無調理紀錄，點上方「新增一筆」</div>';
    return;
  }
  function scoreColor(v, max, invert) {
    var ratio = v / max;
    if (invert) return ratio >= .7 ? 's-good' : ratio >= .4 ? 's-mid' : 's-bad';
    return ratio <= .3 ? 's-good' : ratio <= .6 ? 's-mid' : 's-bad';
  }
  el.innerHTML = sessions.slice().reverse().map(function(s, ri) {
    var i = sessions.length - 1 - ri;
    var pb = s.pb !== '' && s.pb !== undefined ? parseInt(s.pb) : null;
    var pa = s.pa !== '' && s.pa !== undefined ? parseInt(s.pa) : null;
    var sl = s.sleep ? parseInt(s.sleep) : null;
    var en = s.energy ? parseInt(s.energy) : null;

    var scoreHtml = (pb !== null || pa !== null || sl !== null || en !== null) ?
      '<div class="scores">' +
      (pb !== null ? '<div class="score-box"><div class="score-lbl">疼痛前</div><div class="score-val ' + scoreColor(pb,10,false) + '">' + pb + '</div></div>' : '') +
      (pa !== null ? '<div class="score-box"><div class="score-lbl">疼痛後</div><div class="score-val ' + scoreColor(pa,10,false) + '">' + pa + '</div></div>' : '') +
      (sl !== null ? '<div class="score-box"><div class="score-lbl">睡眠</div><div class="score-val ' + scoreColor(sl,5,true) + '">' + sl + '</div></div>' : '') +
      (en !== null ? '<div class="score-box"><div class="score-lbl">精神</div><div class="score-val ' + scoreColor(en,5,true) + '">' + en + '</div></div>' : '') +
      '</div>' : '';

    return '<div class="session-card">' +
      '<div class="session-head">' +
        '<div><div class="session-num">第 ' + (i+1) + ' 次</div><div class="session-date">' + fmt(s.date) + '</div></div>' +
        '<button class="btn btn-sm btn-ghost" onclick="delSession(' + i + ')">刪除</button>' +
      '</div>' +
      scoreHtml +
      (s.feedback ? '<div class="note-block"><div class="note-label">上次回報</div><div class="note-text">' + s.feedback + '</div></div>' : '') +
      (s.complaint ? '<div class="note-block"><div class="note-label">今日主訴</div><div class="note-text">' + s.complaint + '</div></div>' : '') +
      (s.tongue ? '<div class="note-block"><div class="note-label">舌象</div><div class="note-text">' + s.tongue + '</div></div>' : '') +
      (s.areas ? '<div class="note-block"><div class="note-label">操作部位</div><div class="note-text">' + s.areas + '</div></div>' : '') +
      (s.techniques ? '<div class="note-block"><div class="note-label">手法</div><div class="chip-row">' + s.techniques.split('、').filter(Boolean).map(function(t){ return '<span class="chip on-display">' + t + '</span>'; }).join('') + '</div></div>' : '') +
      (s.findings ? '<div class="note-block"><div class="note-label">特別發現</div><div class="note-text">' + s.findings + '</div></div>' : '') +
      (s.response ? '<div class="note-block"><div class="note-label">即時感受</div><div class="note-text">' + s.response + '</div></div>' : '') +
      ((s.homecare || s.next) ? '<div class="next-box">' +
        (s.homecare ? '<div class="note-block"><div class="note-label">居家保養建議</div><div class="note-text">' + s.homecare + '</div></div>' : '') +
        (s.next ? '<div class="note-block" style="margin-bottom:0"><div class="note-label">下次調理重點</div><div class="note-text">' + s.next + '</div></div>' : '') +
      '</div>' : '') +
    '</div>';
  }).join('');
}

function delSession(idx) {
  if (!confirm('確定刪除這筆調理紀錄？')) return;
  clients[currentClientId].sessions.splice(idx, 1);
  save();
  renderSessions();
}

function showNewSession() {
  ['ns-feedback','ns-complaint','ns-pb','ns-tb','ns-tongue','ns-areas','ns-findings','ns-pa','ns-ta','ns-sleep','ns-energy','ns-response','ns-homecare','ns-next'].forEach(function(id){
    document.getElementById(id).value = '';
  });
  clearChips('ns-techniques');
  show('s-new-session');
}

function saveSession() {
  var c = clients[currentClientId];
  c.sessions.push({
    date: new Date().toISOString(),
    feedback: document.getElementById('ns-feedback').value,
    complaint: document.getElementById('ns-complaint').value,
    pb: document.getElementById('ns-pb').value,
    tb: document.getElementById('ns-tb').value,
    tongue: document.getElementById('ns-tongue').value,
    areas: document.getElementById('ns-areas').value,
    techniques: getChips('ns-techniques'),
    findings: document.getElementById('ns-findings').value,
    pa: document.getElementById('ns-pa').value,
    ta: document.getElementById('ns-ta').value,
    sleep: document.getElementById('ns-sleep').value,
    energy: document.getElementById('ns-energy').value,
    response: document.getElementById('ns-response').value,
    homecare: document.getElementById('ns-homecare').value,
    next: document.getElementById('ns-next').value
  });
  save();
  showProfile(currentClientId);
}

renderList();
</script>
</body>
</html>
